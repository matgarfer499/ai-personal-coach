name: Risk gate

# Holds PRs that touch .github/risk-paths until Matías adds the human-ok label.
# pull_request_target runs this file and the path list from the base branch, so a PR cannot
# loosen its own gate. It never checks out or runs PR code: changed files come from the API.
on:
  pull_request_target:
    # edited: retargeting the PR to another base changes its file list.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write # to drop a stale human-ok label

jobs:
  risk-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check risky paths
        # Explicit bash runs with -eo pipefail; the default shell has no pipefail.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          # A missing list or a failed request fails the step, so the gate fails closed.
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/.github/risk-paths?ref=$BASE" \
            | grep -v '^#' | grep -v '^$' > "$RUNNER_TEMP/patterns"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"\(.changed_files) \(.head.sha)"')
          expected=${pr% *} live_head=${pr#* }
          # One row per file; previous_filename catches a risky file renamed out of its path.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | [.filename, .previous_filename // empty] | @tsv' > "$RUNNER_TEMP/rows"
          # The files API stops at 3000 entries: a short list fails closed.
          got=$(wc -l < "$RUNNER_TEMP/rows")
          if [ "$got" -ne "$expected" ]; then
            echo "::error::Got $got of $expected changed files; cannot check the full PR."
            exit 1
          fi
          tr '\t' '\n' < "$RUNNER_TEMP/rows" > "$RUNNER_TEMP/files"
          # grep exits 1 on no match (fine) and 2 on a bad pattern (fail closed).
          risky=$(grep -E -f "$RUNNER_TEMP/patterns" "$RUNNER_TEMP/files" || [ $? -eq 1 ])
          if [ -z "$risky" ]; then
            echo "No risky paths touched."
            exit 0
          fi
          echo "Risky paths touched:"
          echo "$risky" | sed 's/^/  /'
          # Live labels, not the event payload, which can predate another run's removal.
          approved=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" \
            --jq 'any(.[]; .name == "human-ok")')
          # Only label changes (maintainer-only) keep the approval. Any author event voids it,
          # edits too: an edit racing a push could otherwise read the label before it is dropped.
          case "$ACTION" in
            labeled | unlabeled) stale=false ;;
            *) stale=true ;;
          esac
          if [ "$approved" = "true" ] && [ "$stale" = "true" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/human-ok" > /dev/null
            echo "::error::PR changed ($ACTION) after human-ok: label removed, Matías must review again."
            exit 1
          fi
          # A delayed or re-run event can carry an old head: the run for the newest push decides.
          if [ "$approved" = "true" ] && [ "$live_head" != "$HEAD" ]; then
            echo "::error::The PR moved past this event's commit; human-ok is not for the new one."
            exit 1
          fi
          if [ "$approved" = "true" ]; then
            echo "Approved with the human-ok label."
            exit 0
          fi
          echo "::error::This PR touches risky paths and needs Matías's human-ok label."
          exit 1
