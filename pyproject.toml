[project]
name = "coach"
version = "0.1.0"
description = "Evidence-based AI personal coach that runs inside Claude Code"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CONTENT.md"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
pdf = [
    "reportlab>=4.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coach"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
